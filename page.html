<!DOCTYPE html>
<html lang="ca">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enviament de documentació</title>

<style>

body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    padding: 30px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    color: #333;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #e91e63;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

#missatge {
    margin-top: 20px;
    text-align: center;
    font-weight: 600;
}

</style>
</head>

<body>

<div class="container">

<h2>Enviament de documentació</h2>

<form id="formulari">

    <label>Número de soci</label>
    <input type="text" id="numeroSoci" required>

    <label>Correu electrònic</label>
    <input type="email" id="email" required>

    <label>Adjuntar document</label>
    <input type="file" id="fitxer" accept=".pdf,.jpg,.jpeg,.png" required>

    <button type="submit" id="boto">
        Enviar documentació
    </button>

</form>

<div id="missatge"></div>

</div>

<script>

const FLOW_URL = "https://defaulte59cddf81a3d4881a708e2fd5de3a8.84.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/210759ac375249f6aaf1360a4bdf49b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OTZdDijHGWtEmycMIFJnbbKZLM80iDrY-V79lQOaAEc";

document.getElementById("formulari").addEventListener("submit", async function(e) {

    e.preventDefault();

    const boto = document.getElementById("boto");
    const missatge = document.getElementById("missatge");

    const numeroSoci = document.getElementById("numeroSoci").value;
    const email = document.getElementById("email").value;
    const fitxer = document.getElementById("fitxer").files[0];

    if (!fitxer) {
        missatge.textContent = "Has d'adjuntar un document.";
        return;
    }

    boto.disabled = true;
    boto.textContent = "Enviant...";
    missatge.textContent = "";

    try {

        const reader = new FileReader();

        reader.onload = async function() {

            const dades = {
                numeroSoci: numeroSoci,
                email: email,
                fileName: fitxer.name,
                fileContent: reader.result
            };

            try {

                /*const resposta = await fetch(FLOW_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=UTF-8"
                    },
                    body: JSON.stringify(dades)
                });*/
				
				const resposta = await fetch(FLOW_URL, {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify(dades)
				});

                if (!resposta.ok) {
                    throw new Error("Error en l'enviament");
                }

                missatge.style.color = "green";
                missatge.textContent = "Documentació enviada correctament!";

                document.getElementById("formulari").reset();

            } catch (error) {

                missatge.style.color = "red";
                missatge.textContent = "No s'ha pogut enviar el document.";

            }

            boto.disabled = false;
            boto.textContent = "Enviar documentació";

        };

        reader.readAsDataURL(fitxer);

    } catch (error) {

        missatge.textContent = "S'ha produït un error.";

        boto.disabled = false;
        boto.textContent = "Enviar documentació";

    }

});

</script>

</body>
</html>
